name: My first workflow

on: 
  push:
    branches:
      - main
      - '!feature/*'
  pull_request:
    types:
      - opened
      - closed
    paths-ignore:
      - README.md
    branches:
      - main


jobs:
    first_job:
        if: github.ref=='refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: welcome message
              run: |
               echo "My first Github actions"
               ls 
               cat README.md

            # - name: list files
            #   run: ls

            # - name: read the files
            #   run: cat README.md